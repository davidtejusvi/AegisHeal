---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: monitoring-platform
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: aegisheal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dashboard
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false

      containers:
        - name: dashboard
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/aegisheal/dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # Vite env vars are baked at build time, but these are kept for
          # runtime override via nginx proxy paths.
          env:
            - name: VITE_ANOMALY_DETECTOR_URL
              value: "/api/anomaly"
            - name: VITE_REMEDIATION_ENGINE_URL
              value: "/api/remediation"

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

          securityContext:
            runAsNonRoot: true
            runAsUser: 101 # nginx default non-root user
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # nginx writes tmp/cache files
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]

      securityContext:
        fsGroup: 101

      terminationGracePeriodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
  namespace: monitoring-platform
  labels:
    app.kubernetes.io/name: dashboard
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: aegisheal
spec:
  type: ClusterIP
  selector:
    app: dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
