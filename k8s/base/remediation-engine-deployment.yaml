apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-engine
  namespace: monitoring-platform
  labels:
    app.kubernetes.io/name: remediation-engine
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: remediation-service
    app.kubernetes.io/part-of: aegisheal
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port:   "8001"
    prometheus.io/path:   "/metrics"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: remediation-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: remediation-engine
        app.kubernetes.io/name: remediation-engine
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8001"
        prometheus.io/path:   "/metrics"
    spec:
      serviceAccountName: remediation-engine
      automountServiceAccountToken: true

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: remediation-engine
                topologyKey: kubernetes.io/hostname

      containers:
        - name: remediation-engine
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/aegisheal/remediation-engine:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP

          # ── Environment from ConfigMap ──────────────────────────────────
          envFrom:
            - configMapRef:
                name: remediation-engine-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegisheal-db-secret
                  key: DB_PASSWORD
            # Inject pod name for self-identification in K8s API calls
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          # ── Health probes ───────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12

          # ── Resource limits ─────────────────────────────────────────────
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ── Security context ────────────────────────────────────────────
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      securityContext:
        fsGroup: 1000

      terminationGracePeriodSeconds: 60   # longer — may be mid-remediation
