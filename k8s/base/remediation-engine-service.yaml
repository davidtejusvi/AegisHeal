apiVersion: v1
kind: Service
metadata:
  name: remediation-engine-service
  namespace: monitoring-platform
  labels:
    app.kubernetes.io/name: remediation-engine
    app.kubernetes.io/component: remediation-service
    app.kubernetes.io/part-of: aegisheal
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port:   "8001"
    prometheus.io/path:   "/metrics"
spec:
  type: ClusterIP
  selector:
    app: remediation-engine
  ports:
    - name: http
      port: 80
      targetPort: http          # named port on the container (8001)
      protocol: TCP
