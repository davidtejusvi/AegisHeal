apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-detector
  namespace: monitoring-platform
  labels:
    app.kubernetes.io/name: anomaly-detector
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: ml-service
    app.kubernetes.io/part-of: aegisheal
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port:   "8000"
    prometheus.io/path:   "/metrics"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anomaly-detector
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime rolling deploy
  template:
    metadata:
      labels:
        app: anomaly-detector
        app.kubernetes.io/name: anomaly-detector
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8000"
        prometheus.io/path:   "/metrics"
    spec:
      serviceAccountName: anomaly-detector
      automountServiceAccountToken: true

      # Prefer separate nodes from remediation-engine for fault isolation
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: anomaly-detector
                topologyKey: kubernetes.io/hostname

      containers:
        - name: anomaly-detector
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/aegisheal/anomaly-detector:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # ── Environment from ConfigMap ──────────────────────────────────
          envFrom:
            - configMapRef:
                name: anomaly-detector-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegisheal-db-secret
                  key: DB_PASSWORD

          # ── Health probes ───────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12  # allow up to 2 min for model load

          # ── Resource limits ─────────────────────────────────────────────
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"     # generous for PyTorch LSTM model

          # ── Security context ────────────────────────────────────────────
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # uvicorn writes tmp files
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

      securityContext:
        fsGroup: 1000

      terminationGracePeriodSeconds: 30

      # Tolerate node taints used for ML workloads
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "ml"
          effect: "NoSchedule"
