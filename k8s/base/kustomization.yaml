apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-platform

resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  - secret.yaml
  - cluster-secret-store.yaml
  - anomaly-detector-deployment.yaml
  - anomaly-detector-service.yaml
  - remediation-engine-deployment.yaml
  - remediation-engine-service.yaml
  - hpa.yaml
  - pdb.yaml
  - network-policy.yaml
  - dashboard-deployment.yaml
  - ingress.yaml
  - prometheus.yaml
  - grafana.yaml

# NOTE: commonLabels removed — it injects labels onto CRDs (ClusterSecretStore,
# ExternalSecret) and Namespace which can cause apply errors with strict admission
# webhooks. Labels are set per-resource in each manifest instead.
