---
# Ingress — AWS Application Load Balancer (ALB)
# Requires: AWS Load Balancer Controller installed in kube-system
# https://kubernetes-sigs.github.io/aws-load-balancer-controller/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegisheal-ingress
  namespace: monitoring-platform
  labels:
    app.kubernetes.io/part-of: aegisheal
  annotations:
    # ALB controller
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal        # change to internet-facing for public
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # ACM certificate ARN — replace with actual value
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_ID"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # Enable access logs
    alb.ingress.kubernetes.io/load-balancer-attributes: >-
      access_logs.s3.enabled=true,
      access_logs.s3.bucket=aegisheal-alb-logs,
      access_logs.s3.prefix=aegisheal
spec:
  rules:
    - host: aegisheal.internal.example.com       # replace with your domain
      http:
        paths:
          # Anomaly Detector API
          - path: /anomaly
            pathType: Prefix
            backend:
              service:
                name: anomaly-detector-service
                port:
                  name: http
          # Remediation Engine API
          - path: /remediation
            pathType: Prefix
            backend:
              service:
                name: remediation-engine-service
                port:
                  name: http
