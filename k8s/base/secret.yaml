---
# Database credentials
# In production, populate via AWS Secrets Manager + External Secrets Operator,
# or use a sealed-secrets tool (e.g. Sealed Secrets / SOPS).
# Values here are base64-encoded placeholders — replace before deploying.
#
# To generate:  echo -n 'my-password' | base64
apiVersion: v1
kind: Secret
metadata:
  name: aegisheal-db-secret
  namespace: monitoring-platform
  labels:
    app.kubernetes.io/part-of: aegisheal
type: Opaque
data:
  # base64("changeme")
  DB_PASSWORD: Y2hhbmdlbWU=
  # base64("aimonitor")
  DB_USER: YWltb25pdG9y

---
# AWS credentials (only needed when NOT using IRSA / Pod Identity)
# Leave empty if using IRSA — the ServiceAccount annotation handles auth.
apiVersion: v1
kind: Secret
metadata:
  name: aegisheal-aws-secret
  namespace: monitoring-platform
  labels:
    app.kubernetes.io/part-of: aegisheal
type: Opaque
data:
  # base64("") — replace with real keys if not using IRSA
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
